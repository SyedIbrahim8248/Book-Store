<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Book Store</title>
  <style>
    body { font-family: Arial; margin:0; background:#f9f9f9; }
    header { background:#007bff; color:#fff; padding:15px; text-align:center; }
    nav { background:#0056b3; padding:10px; text-align:center; }
    nav a { color:#fff; margin:0 15px; text-decoration:none; font-weight:bold; }
    nav a:hover { text-decoration:underline; }
    .search-bar { text-align:center; margin:20px; }
    .search-bar input { padding:10px; width:60%; border:1px solid #ccc; border-radius:5px; }
    .store { display:flex; flex-wrap:wrap; justify-content:center; }
    .product {
      background:#fff; border:1px solid #ddd; border-radius:10px;
      margin:10px; padding:15px; width:220px; text-align:center;
      box-shadow:0 4px 6px rgba(0,0,0,0.1);
    }
    .product img { width:100%; border-radius:5px; }
    button {
      background:#007bff; color:white; border:none; padding:8px 12px;
      margin-top:10px; cursor:pointer; border-radius:5px;
    }
    button:hover { background:#0056b3; }
    #cart { margin:30px auto; max-width:600px; background:#fff; padding:20px; border-radius:10px; }
    footer {
      background:#222; color:#fff; text-align:center; padding:20px; margin-top:30px;
    }
    footer a { color:#66a6ff; margin:0 10px; text-decoration:none; }
    footer a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <header>
    <h1>📚 Welcome to My Book Store</h1>
    <p>Developed by Syed Ibrahim</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Books</a>
    <a href="#cart">Cart</a>
    <a href="#contact">Contact Us</a>
  </nav>

  <div class="search-bar">
    <input type="text" id="searchBox" placeholder="Search books..." onkeyup="searchBooks()">
  </div>

  <div class="store" id="store"></div>

  <div id="cart">
    <h2>🛒 Shopping Cart</h2>
    <ul id="cartItems"></ul>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button onclick="confirmOrder()">✅ Confirm Order</button>
    <p id="orderMessage" style="color:green; font-weight:bold;"></p>
  </div>

  <footer id="contact">
    <p>📞 Phone: <a href="tel:6200998924">6200998924</a> | ✉️ Email: <a href="mailto:hasanibrahim48845@gmail.com">hasanibrahim48845@gmail.com</a></p>
    <p>
      🌐 Connect: 
      <a href="https://linkedin.com">LinkedIn</a> | 
      <a href="https://github.com">GitHub</a> | 
      <a href="https://instagram.com">Instagram</a>
    </p>
  </footer>

  <script>
    const products = [
      { name: "Java Programming", price: 800, img: "https://via.placeholder.com/200?text=Java+Book" },
      { name: "Data Structures", price: 600, img: "https://via.placeholder.com/200?text=DS+Book" },
      { name: "Web Development", price: 700, img: "https://via.placeholder.com/200?text=Web+Book" },
      { name: "Database Systems", price: 650, img: "https://via.placeholder.com/200?text=DB+Book" },
      { name: "Cybersecurity Basics", price: 500, img: "https://via.placeholder.com/200?text=Security+Book" }
    ];

    let cart = [];

    function displayStore(filtered = products) {
      const storeDiv = document.getElementById("store");
      storeDiv.innerHTML = "";
      filtered.forEach((p, i) => {
        storeDiv.innerHTML += `
          <div class="product">
            <img src="${p.img}" alt="${p.name}">
            <h3>${p.name}</h3>
            <p>₹${p.price}</p>
            <button onclick="addToCart(${i})">Add to Cart</button>
          </div>`;
      });
    }

    function addToCart(index) {
      cart.push(products[index]);
      displayCart();
    }

    function displayCart() {
      const cartList = document.getElementById("cartItems");
      cartList.innerHTML = "";
      let total = 0;
      cart.forEach(item => {
        cartList.innerHTML += `<li>${item.name} - ₹${item.price}</li>`;
        total += item.price;
      });
      document.getElementById("total").innerText = total;
    }

    function confirmOrder() {
      if(cart.length === 0) {
        document.getElementById("orderMessage").innerText = "❌ No items in cart!";
      } else {
        document.getElementById("orderMessage").innerText = "✅ Order Confirmed! Thank you for shopping.";
      }
    }

    function searchBooks() {
      const query = document.getElementById("searchBox").value.toLowerCase();
      const filtered = products.filter(book => book.name.toLowerCase().includes(query));
      displayStore(filtered);
    }

    // Initialize store
    displayStore();
  </script>
</body>
</html>
